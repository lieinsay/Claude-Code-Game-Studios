# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: room_existence
    status: active
    source: design/gdd/airship-hub.md
    referenced_by:
      - design/gdd/airship-hub.md
      - design/gdd/airship-modules-hull-state.md
    variables:
      - room_base_exists
      - room_requires_module
      - module_installed
    output_range: [false, true]
    expression: "room_exists(room_id) = room_base_exists(room_id) OR (room_requires_module(room_id, module_id) AND module_installed(module_id))"
    notes: "Determines whether a room physically exists on the airship. Cargo hold requires cargo/repair module to exist."
    added: 2026-04-30
    revised: ""
  - name: departure_lock_timer
    status: active
    source: design/gdd/airship-hub.md
    referenced_by:
      - design/gdd/airship-hub.md
      - design/gdd/chart-route-planning.md
    variables:
      - base_lock_duration
    output_range: [1.5, 3.0]
    expression: "departure_lock_duration = clamp(base_lock_duration, 1.5, 3.0)"
    notes: "Locks player movement during departure animation. Default 2.0s. Runtime clamp() provides last-line defense; startup validation rejects values outside 1.0-5.0 and falls back to 2.0s. Protects Pillar 1 intentional departure."
    added: 2026-04-30
    revised: 2026-05-02  # referenced_by extended: chart-route-planning uses base_lock_duration for departure lock

  - name: route_visibility
    status: active
    source: design/gdd/chart-route-planning.md
    referenced_by:
      - design/gdd/chart-route-planning.md
    variables:
      - knowledge_state
      - hide_rumored
    output_range: [false, true]
    expression: "route_visibility(route_id, hide_rumored) = (knowledge_state != unknown) AND NOT (hide_rumored AND knowledge_state == rumored)"
    notes: "Binary rendering decision. unknown routes are NEVER visible (hard boundary)."
    added: 2026-05-02
    revised: ""

  - name: route_selectability
    status: active
    source: design/gdd/chart-route-planning.md
    referenced_by:
      - design/gdd/chart-route-planning.md
    variables:
      - route_id
      - chart_state
      - docked_location
      - hide_rumored
      - selected_route_id
      - traversable
      - origin_id
    output_range: [hidden, browsable, selected, unavailable, locked]
    expression: "Short-circuit eval: visibility → terminal state → traversability → origin match → selection match → fallback"
    notes: "Per-route interactivity classification. Short-circuit order is load-bearing — hidden and locked must be checked before other branches."
    added: 2026-05-02
    revised: ""

  - name: chart_state_transition
    status: active
    source: design/gdd/chart-route-planning.md
    referenced_by:
      - design/gdd/chart-route-planning.md
    variables:
      - current_state
      - trigger
      - trigger_payload
    output_range: "[{new_state, allowed}] — allowed ∈ {true, false}"
    expression: "Piecewise function over 5 states × 6 triggers. DEPARTURE_CONFIRMED is terminal and rejects all triggers."
    notes: "Chart-level state machine. Enforces irreversible departure commitment and ERROR→LOADING→BROWSING gating."
    added: 2026-05-02
    revised: ""

  - name: snapshot_package_validity
    status: active
    source: design/gdd/chart-route-planning.md
    referenced_by:
      - design/gdd/chart-route-planning.md
      - design/gdd/local-save-world-state-persistence.md
    variables:
      - domain_id
      - fields
      - current_time
      - timestamp_tolerance
      - route_registry
    output_range: "[{valid: bool, violations: string[]}]"
    expression: "Validate domain_id, required fields presence, departure_state value, timestamp finiteness, timestamp direction, route_id existence"
    notes: "Cross-system contract with Save/Persistence (#3). Validates progress.routes snapshots before write. Extended by EC-9 and EC-10 to include route existence check and timestamp direction check."
    added: 2026-05-02
    revised: ""

  - name: route_display_order
    status: active
    source: design/gdd/chart-route-planning.md
    referenced_by:
      - design/gdd/chart-route-planning.md
    variables:
      - knowledge_state
      - distance_band
    output_range: [101, 303]
    expression: "display_order = rank_by_knowledge × 100 + rank_by_distance, where verified=1, identified=2, rumored=3 and short=1, medium=2, long=3"
    notes: "Lower values sort first. Knowledge confidence tier (verified > identified > rumored) dominates via 100× multiplier. Within same tier, shorter distance sorts first."
    added: 2026-05-02
    revised: ""

  - name: search_yield
    status: active
    source: design/gdd/exploration-scavenge-scenario.md
    referenced_by:
      - design/gdd/exploration-scavenge-scenario.md
    variables:
      - sp_id
      - zone
      - state
      - empty_chance
      - quality_weights
      - loot_pool
      - draw_count
    output_range: "[0, 5] items"
    expression: "Three-step: empty check → tier roll (weighted random) → draw without replacement from loot_pool[sp_id][tier]"
    added: 2026-05-02
    revised: ""

  - name: threat_trigger
    status: active
    source: design/gdd/exploration-scavenge-scenario.md
    referenced_by:
      - design/gdd/exploration-scavenge-scenario.md
    variables:
      - threat_point
      - trigger_type
      - player_pos
      - trigger_prob
      - trigger_radius
    output_range: "[false, true]"
    expression: "interaction → always trigger; proximity → distance check + category probability (environmental=1.0, guard=0.70)"
    added: 2026-05-02
    revised: ""

  - name: scout_preview_level
    status: active
    source: design/gdd/exploration-scavenge-scenario.md
    referenced_by:
      - design/gdd/exploration-scavenge-scenario.md
    variables:
      - η_scout
    output_range: "[PREVIEW_NONE, PREVIEW_PRESENCE, PREVIEW_FULL]"
    expression: "η_scout <= 0 → NONE; η_scout >= 1.0 → FULL; else → PRESENCE"
    added: 2026-05-02
    revised: ""

  - name: extraction_loss_settlement
    status: active
    source: design/gdd/exploration-scavenge-scenario.md
    referenced_by:
      - design/gdd/exploration-scavenge-scenario.md
    variables:
      - carried_stacks
      - voyage_result
      - λ_success
      - λ_forced
    output_range: "[0, total_carried_qty)"
    expression: "Unique items (Q=1) skip loss; others: loss_qty = min(Q-1, max(1, ceil(Q × λ)))"
    added: 2026-05-02
    revised: ""

  - name: exploration_state_variant_transition
    status: active
    source: design/gdd/exploration-scavenge-scenario.md
    referenced_by:
      - design/gdd/exploration-scavenge-scenario.md
    variables:
      - current_state
      - all_searched
      - env_threat_active
    output_range: "[unlooted, looted, danger-changed]"
    expression: "Piecewise: env_threat_active → danger-changed (priority); all_searched → looted; else unlooted (or unchanged)"
    added: 2026-05-02
    revised: ""

  - name: intel_yield
    status: active
    source: design/gdd/exploration-scavenge-scenario.md
    referenced_by:
      - design/gdd/exploration-scavenge-scenario.md
    variables:
      - intel_point_id
    output_range: "1 Unique intel item"
    expression: "Fixed yield: 1 intel item (Q=1, max_stack=1) per intel point per session"
    added: 2026-05-02
    revised: ""

  - name: confidence_clamp
    status: active
    source: design/gdd/partner-relationships.md
    referenced_by:
      - design/gdd/partner-relationships.md
      - design/gdd/player-knowledge-intel.md
    variables:
      - item.cat_sniff_signature.confidence
      - MVP_CONFIDENCE_MAX
    output_range: [0, 66]
    expression: "confidence_final(item) = min(item.cat_sniff_signature.confidence, MVP_CONFIDENCE_MAX)"
    notes: "Clamps partner sniff confidence to MVP hard cap (66). Protects P1 verification and P4 mild pressure. #6 receives clamped value via reveal_rumor(). Raw confidence from #1 content data may be 0-100; this formula is the gate."
    added: 2026-05-02
    revised: ""

  - name: naming_prompt_eligibility
    status: active
    source: design/gdd/partner-relationships.md
    referenced_by:
      - design/gdd/partner-relationships.md
    variables:
      - naming_state
      - sniff_success_occurred
      - player_returned_to_hub
      - naming_skip_count
      - NAMING_SKIP_MAX
    output_range: [false, true]
    expression: "naming_eligible = (naming_state == pending) AND (sniff_success_occurred == true) AND (player_returned_to_hub == true) AND (naming_skip_count < NAMING_SKIP_MAX)"
    notes: "4-way boolean conjunction determining whether naming UI opens on return-to-hub. Output consumed by #16 (UI). NAMING_SKIP_MAX = 3 in MVP."
    added: 2026-05-02
    revised: ""

