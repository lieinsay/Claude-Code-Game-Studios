    adr: docs/architecture/adr-0003-save-system-snapshot-json.md
    signal_signature: "register_domain_serializer(domain_id: String, serializer: Callable) — serializer returns SnapshotPackage (RefCounted). SnapshotPackage.to_canonical_json() → deterministic JSON string. Persistence validates but does not interpret payload."
    referenced_by:
