    adr: docs/architecture/adr-0005-resource-pool-system.md
    signal_signature: "8 typed signals: pool_changed(pool_id: StringName) / resource_added(pool_id, resource_id: StringName, quantity: int) / resource_removed(pool_id, resource_id: StringName, quantity: int) / transfer_completed(from_pool, to_pool: StringName, resource_id: StringName, quantity: int) / cargo_unpacked(cargo_id, resource_id: StringName, quantity: int) / deposit_committed(repair_node_id: StringName) / deposit_failed(repair_node_id: StringName, reason: StringName) / mass_changed(new_mass: int). Emit-after-mutation. Re-entrancy guard: ERR_BUSY."
    referenced_by:
      - docs/architecture/adr-0005-resource-pool-system.md
    added: 2026-05-04
    revised: ""
    note: "Supersedes ADR-0002 provisional resource signal entries — pool_changed type corrected from int to StringName; deposit_committed param renamed node_id→repair_node_id; deposit_failed added as paired signal."

