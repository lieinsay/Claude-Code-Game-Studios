# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: autoload_heavy_ready
    status: active
    description: "Autoload _ready() must not perform file I/O, scene instantiation, audio playback, or cross-autoload method calls. Only constant init, signal declarations, and null checks."
    why: "Blocks first-frame render on Web; creates hidden init-order dependencies between Autoloads."
    adr: docs/architecture/adr-0001-autoload-scene-boot-order.md
    added: 2026-05-04

  - pattern: boot_sequencer_god_object
    status: active
    description: "The boot sequencer (SessionShell) must only emit signals in order — it must never call domain system init methods directly or access domain state internals."
    why: "Direct calls bypass the signal contract and create a God Object that knows every system's internal initialization API."
    adr: docs/architecture/adr-0001-autoload-scene-boot-order.md
    added: 2026-05-04

  - pattern: runtime_dynamic_autoload
    status: active
    description: "Do not attempt to register or remove Autoloads at runtime in exported games. EditorPlugin.add_autoload_singleton() / remove_autoload_singleton() are editor-only APIs."
    why: "Godot 4.x has no public runtime API for dynamic Autoload management. Use add_child/remove_child for runtime scene management instead."
    adr: docs/architecture/adr-0001-autoload-scene-boot-order.md
    added: 2026-05-04

  - pattern: missing_scene_exit_cleanup
    status: active
    description: "Before queue_free() on a scene, must explicitly stop() all running Tweens, cancel all active await coroutines, disconnect external signal connections, and call release_focus() on the root Control."
    why: "Active Tweens/await coroutines referencing freed nodes cause crashes. Lingering focus claims conflict with Godot 4.6 dual-focus system."
    adr: docs/architecture/adr-0001-autoload-scene-boot-order.md
    added: 2026-05-04

  - pattern: cross_phase_direct_call
    status: active
    description: "A system must never call another system's methods before that system's init phase signal has fired. Systems in later phases must wait for the earlier phase's ready signal."
    why: "Violates the boot phase dependency ordering. A Core system calling a Feature system during Phase 3 would read uninitialized state."
    adr: docs/architecture/adr-0001-autoload-scene-boot-order.md
    added: 2026-05-04

  - pattern: dictionary_signal_payload
    status: active
    description: "Signal payloads must use typed parameters (signal foo(id: String, amount: int)), never Dictionary. All signal params must have explicit type annotations."
    why: "Dictionary payloads lose compile-time type checking, cannot be refactored by IDE, and enable accidental mutable reference passing. Typed params enable IDE autocomplete, refactoring, and runtime type validation."
    adr: docs/architecture/adr-0002-signal-communication-protocol.md
    added: 2026-05-04

  - pattern: signal_emit_call_deferred
    status: active
    description: "Cross-system signals must use synchronous emit(), never emit.call_deferred(). call_deferred breaks execution order predictability and makes signal chains undebuggable."
    why: "Synchronous emit guarantees all consumers execute in known order within the current frame. call_deferred defers to idle time, making it impossible to reason about causal ordering in signal chains."
    adr: docs/architecture/adr-0002-signal-communication-protocol.md
    added: 2026-05-04

  - pattern: signal_cascade_depth_gt_2
    status: active
    description: "Signal chains must not exceed 2 hops depth. A→B→C is allowed; A→B→C→D is forbidden. Use fan-out (A signals B, C, D directly) instead of deep chains."
    why: "Deep signal chains become undebuggable — a broken link in the middle silently stops downstream effects. Fan-out keeps the dependency graph shallow and explicit."
    adr: docs/architecture/adr-0002-signal-communication-protocol.md
    added: 2026-05-04

  - pattern: untyped_signal_param
    status: active
    description: "All signal parameters must have explicit type annotations. signal foo(data) is forbidden; signal foo(node_id: String, amount: int) is required."
    why: "Untyped params accept any Variant at emit time, bypassing type safety. GDScript compiler cannot validate untyped signal signatures, leaving type errors to surface only at runtime."
    adr: docs/architecture/adr-0002-signal-communication-protocol.md
    added: 2026-05-04
  - pattern: string_based_interaction_dispatch
    status: active
    description: "InteractionRegistry must not route Use requests by matching interaction_type string to domain system handlers. Domain dispatch uses Interactable.handle_use() method call, not string-keyed handler lookup."
    why: "String-based dispatch loses type safety (typo in interaction_type = runtime failure), requires InteractionRegistry to know every domain system API (God Object), and prevents IDE from finding all Use handlers. @abstract handle_use() keeps each Interactable subclass responsible for its own domain delegation."
    adr: docs/architecture/adr-0004-interaction-handler-abstract.md
    added: 2026-05-04
  - pattern: cross_system_resource_state_write
    status: active
    description: "Domain systems must not modify resource pool contents directly. All resource mutations must go through ResourcesManager operations (add/remove/transfer/consume/discard)."
    why: "ResourcesManager is the single authoritative source for all resource state. Direct writes bypass capacity checks, stack merge logic, signal emission, and atomicity guarantees. This would cause desynchronization between actual pool state and what UIManager displays."
    adr: docs/architecture/adr-0005-resource-pool-system.md
    added: 2026-05-04

  - pattern: resource_signal_callback_mutation
    status: active
    description: "Signal handlers (callbacks connected to resource_added, resource_removed, etc.) must not call ResourcesManager mutation methods (add/remove/transfer/consume/discard/commit_deposit). Re-entrant mutation returns ERR_BUSY."
    why: "Signal callbacks execute synchronously within the emit() call stack. A mutation during a signal callback would modify pool state while the original operation is still finalizing, breaking atomicity and potentially causing infinite recursion. Use call_deferred() to schedule follow-up mutations."
    adr: docs/architecture/adr-0005-resource-pool-system.md
    added: 2026-05-04
  - pattern: thread_api_usage
    status: active
    description: "Do not use Thread, Mutex, Semaphore, or WorkerThreadPool APIs anywhere in the project. All code must assume single-threaded execution on the browser main thread."
    why: "Web export uses single-threaded mode (threaded export requires COOP/COEP headers unavailable on common static hosts). Thread APIs will cause runtime errors or silent failure in Web export. All game logic must complete within 16.6ms/frame on the main thread."
    adr: docs/architecture/adr-0006-web-platform-constraints.md
    added: 2026-05-04

  - pattern: csharp_for_web
    status: active
    description: "Do not use C# scripts for any code that must run in the Web export. All game logic must be GDScript. C# files (.cs) in the project are a Web export blocking error."
    why: "Godot 4 C# projects cannot be exported to Web — this is a hard engine limitation. C# assemblies are not compiled to WebAssembly in the Godot Web export pipeline."
    adr: docs/architecture/adr-0006-web-platform-constraints.md
    added: 2026-05-04

  - pattern: gdextension_for_web
    status: active
    description: "GDExtension libraries (.gdextension, .dll, .so, .dylib) must not be listed as dependencies for the Web export path. Desktop development may use GDExtensions for editor tools only — these must be excluded from Web CI build steps."
    why: "GDExtension native libraries cannot run in browser WebAssembly environment. Including them in Web export causes build failure."
    adr: docs/architecture/adr-0006-web-platform-constraints.md
    added: 2026-05-04
  - pattern: direct_knowledge_state_write
    status: active
    description: "Domain systems must not write to knowledge_state, pattern_state, ability_state, consumed_intel_ids, or rumor_sources directly. All knowledge/ability state mutations must go through IntelManager methods (consume_intel, reveal_rumor, player_arrived_at, report_observation_event, etc.)."
    why: "IntelManager is the single authoritative source for all player knowledge and ability state. Direct writes bypass state machine validation, observation score accumulation, rumor conflict resolution, ability unlock re-evaluation, and signal emission. This would cause UI desynchronization and broken game progression."
    adr: docs/architecture/adr-0007-intel-knowledge-ability-system.md
    added: 2026-05-05

  - pattern: downstream_knowledge_cache
    status: active
    description: "Downstream systems (Chart, Navigation, Exploration, UI) must not cache knowledge/ability query results. Every read must re-query IntelManager for current state."
    why: "Knowledge state can change within a single frame (e.g., consume_intel triggers multiple state transitions). Cached values become stale immediately and cause visual inconsistencies — a route shown as 'identified' in Chart while IntelManager has it as 'verified' after a player_arrived_at event."
    adr: docs/architecture/adr-0007-intel-knowledge-ability-system.md
    added: 2026-05-05

  - pattern: direct_module_state_write
    status: active
    description: "Domain systems must not write to module_slots, hull_integrity, or hull_scars directly. All module/hull state mutations must go through AirshipModuleSystem methods (install_module, uninstall_module, swap_module, apply_hull_damage, apply_module_damage, repair_hull, repair_module, on_voyage_return)."
    why: "AirshipModuleSystem is the single authoritative source for all module and hull state. Direct writes bypass the dual-field state machine, efficiency recalculation, signal emission (6 typed signals), departure readiness re-evaluation, and atomicity guarantees. This would cause Hub visual desynchronization, incorrect can_depart() results, and broken trapped cargo detection."
    adr: docs/architecture/adr-0009-airship-module-hull-system.md
    added: 2026-05-05

  - pattern: cached_departure_state
    status: active
    description: "Downstream systems (Navigation, Hub, UI) must not cache can_depart() results or derived values (M_max, hull_band). Every departure gate check must re-query AirshipModuleSystem for current state."
    why: "Module and hull state can change within a single frame (e.g., swap_module changes furnace configuration, apply_hull_damage changes hull band). Cached departure state becomes stale immediately and could allow departure when the ship is actually grounded — a critical gameplay integrity bug. AirshipModuleSystem internally caches for signal noise reduction only; external consumers must always re-query."
    adr: docs/architecture/adr-0009-airship-module-hull-system.md
    added: 2026-05-05

  - pattern: encounter_context_mutation_in_consumer
    status: active
    description: "Consumers of EncounterContext (Exploration #11, Persistence #3, Combat #12 via ThreatContext) must not modify the received Dictionary. EncounterContext is immutable after voyage_completed emission — the Navigation's _build_encounter_context() with .duplicate(true) is the only mutation point."
    why: "EncounterContext represents historical voyage record — modifying it after the fact corrupts the audit trail. Multiple consumers (Exploration + Persistence in the same frame) would see inconsistent data if one mutates. Persistence must capture exactly what Navigation produced."
    adr: docs/architecture/adr-0010-encounter-context-type.md
    added: 2026-05-05

  - pattern: direct_encounter_context_construction
    status: active
    description: "Only Navigation (#10) may construct EncounterContext. Exploration (#11) may only construct fallback context via _build_fallback_context() when validation fails. Combat (#12) must consume ThreatContext derived by Exploration, never raw EncounterContext directly."
    why: "Navigation is the sole authority on voyage outcomes — allowing other systems to construct EncounterContext would bypass the voyage state machine and create conflicting voyage records. Fallback context is explicitly labeled as fallback (route_id='unknown') and logged for debugging."
    adr: docs/architecture/adr-0010-encounter-context-type.md
    added: 2026-05-05

  - pattern: direct_repair_state_write
    status: active
    description: "Domain systems must not write to repair_nodes, repair_state, deposited counters, or repair_progress directly. All repair state mutations must go through WorldRepair methods (on_player_arrived_at_repair_node, submit_deposit)."
    why: "WorldRepair is the single authoritative source for all repair node state. Direct writes bypass the 3-state machine validation, deposit_validation guards, repair_completion trigger, signal fan-out (6 downstream systems), and irreversibility guarantees. This would cause desynchronization between actual repair state and what Chart/Intel/UI display."
    adr: docs/architecture/adr-0011-world-repair-state-machine.md
    added: 2026-05-05

  - pattern: repair_bypass_irreversibility
    status: active
    description: "Must not attempt to reverse repair state: known→unrevealed, repaired→known, and repaired→unrevealed are all rejected by the state machine. Repaired nodes must reject submit_deposit with ERR_ALREADY_REPAIRED. The deposited counter must never decrement."
    why: "Repair is irreversible by design — materials enter Pool 6 (final state) via commit_deposit. Reversing repair would require 'un-committing' from Pool 6, which violates ADR-0005's ResourceManager atomicity and Pool 6 finality. Pillar 2 (世界会回应照料) requires that player care leaves permanent, visible traces in the world."
    adr: docs/architecture/adr-0011-world-repair-state-machine.md
    added: 2026-05-05

  - pattern: ui_process_polling
    status: active
    description: "HUD elements must not use _process() polling to read domain state. All HUD updates must be signal-driven: domain signal → dirty flag → _process batch update. Idle frames must have zero _process overhead."
    why: "Polling domain state in _process() wastes CPU on idle frames, violates ADR-0002 read-vs-signal boundary, and creates frame ordering non-determinism. Signal-driven dirty flag batching ensures HUD renders exactly when data changes and is Web tab-freeze safe (signals accumulate during freeze, batch applied on resume)."
    adr: docs/architecture/adr-0012-ui-input-routing-dual-focus.md
    added: 2026-05-05

  - pattern: ui_direct_canvas_draw
    status: active
    description: "Must not use Canvas draw_*() methods (draw_rect, draw_circle, draw_line, draw_texture) for UI animations, particularly the ink spread animation. Use ShaderMaterial + uniform progress on GPU side, or create_tween() for property interpolation."
    why: "Canvas draw_*() executes on CPU per-frame and triggers full CanvasItem redraw. Under WebGL 2 Compatibility renderer, CPU-side drawing is significantly slower than GPU ShaderMaterial. Ink spread via draw_*() would consume ~2-5ms/frame on Web — exceeding the animation budget. ShaderMaterial performs the same visual at <0.1ms GPU-side."
    adr: docs/architecture/adr-0012-ui-input-routing-dual-focus.md
    added: 2026-05-05

  - pattern: direct_chart_state_write
    status: active
    description: "Domain systems must not write to Chart internal state (_chart_state, _route_states, _visible_routes, _selected_route_id, _hide_rumored, _last_committed_route_id) directly. All chart state mutations must go through Chart methods (open_chart, chart_state_transition, _commit_departure, _reevaluate_all_routes)."
    why: "Chart is the single authoritative source for all route selection and departure state. Direct writes bypass the 5-state machine validation, terminal state guard, route_committed single-emit guarantee, and signal emission (route_committed, route_selection_failed, route_enhanced). This would cause Navigation to receive duplicate departure events and UIManager to display inconsistent route states."
    adr: docs/architecture/adr-0008-chart-route-state-machine.md
    added: 2026-05-05

  - pattern: cached_intel_route_query
    status: active
    description: "Chart must not cache query_route_knowledge() or query_route_accessibility() results. Every route_selectability() evaluation must re-query IntelManager for current traversable and knowledge state. Chart's internal _route_states and _visible_routes are derived state — not caches of IntelManager results."
    why: "Knowledge state can change within a single frame (consume_intel triggers knowledge_advanced signal). Cached traversable values become stale immediately and could show a route as BROWSABLE when it's actually UNAVAILABLE — or vice versa. This extends ADR-0007's downstream_knowledge_cache forbidden pattern to Chart specifically."
    adr: docs/architecture/adr-0008-chart-route-state-machine.md
    added: 2026-05-05

