# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: scene_management
    status: active
    api: "SceneTree.root.add_child() / remove_child() / queue_free()"
    not: "change_scene_to_file() for Hub↔Exploration↔Settlement transitions"
    adr: docs/architecture/adr-0001-autoload-scene-boot-order.md
    reason: "add_child overlay preserves persistent layers (SessionShell, UIManager, AirshipHub) across scene transitions; change_scene_to_file replaces entire tree"
    referenced_by:
      - docs/architecture/adr-0001-autoload-scene-boot-order.md
    added: 2026-05-04
    revised: ""

  - purpose: boot_sequencing
    status: active
    api: "Godot signal chain (9-phase sequential signals from SessionShell)"
    not: "Autoload _ready() synchronous init; call_deferred() passive deferral"
    adr: docs/architecture/adr-0001-autoload-scene-boot-order.md
    reason: "Signal chain is explicit, traceable, and testable; _ready() synchronous init creates hidden ordering dependencies; call_deferred() offers no phase gating"
    referenced_by:
      - docs/architecture/adr-0001-autoload-scene-boot-order.md
    added: 2026-05-04
    revised: ""

  - purpose: scene_cleanup
    status: active
    api: "Node.queue_free()"
    not: "Node.free() (immediate, unsafe during signal emission); manual delete"
    adr: docs/architecture/adr-0001-autoload-scene-boot-order.md
    reason: "queue_free() is safe in Godot 4.6: signals auto-disconnect bidirectionally on free, Resources use ref-counting, no use-after-free when combined with signal payloads carrying only IDs (not object references)"
    referenced_by:
      - docs/architecture/adr-0001-autoload-scene-boot-order.md
    added: 2026-05-04
    revised: ""

  - purpose: signal_connect_syntax
    status: active
    api: "sender.signal_name.connect(receiver.method_name)"
    not: "sender.connect(\"signal_name\", callable) — string-based connect (deprecated since 4.0)"
    adr: docs/architecture/adr-0002-signal-communication-protocol.md
    reason: "Signal.connect() is type-safe — the signal_name is a compiled symbol, not a runtime string. IDE can find references, rename, and validate connection existence."
    referenced_by:
      - docs/architecture/adr-0002-signal-communication-protocol.md
    added: 2026-05-04
    revised: ""

  - purpose: signal_emit_sync
    status: active
    api: "signal.emit() — synchronous fire-and-forget in current frame"
    not: "signal.emit.call_deferred() — deferred emit breaks execution order"
    adr: docs/architecture/adr-0002-signal-communication-protocol.md
    reason: "Synchronous emit guarantees consumers execute in known order within the current frame. Essential for debugging signal chains and maintaining causal consistency."
    referenced_by:
      - docs/architecture/adr-0002-signal-communication-protocol.md
    added: 2026-05-04
    revised: ""

  - purpose: read_vs_signal_boundary
    status: active
    api: "Direct method call for read queries and action requests (returning Result); Signal for state-change notifications (fire-and-forget)"
    not: "Signal for read queries (would require return value — signals cannot return); Direct method call for fan-out notifications (tight coupling)"
    adr: docs/architecture/adr-0002-signal-communication-protocol.md
    reason: "Read queries need return values → direct call. State-change notifications need fan-out to unknown consumers → signal. This distinction prevents both return-value-via-signal hacks and tight-coupling-via-direct-call fanout."
    referenced_by:
      - docs/architecture/adr-0002-signal-communication-protocol.md
    added: 2026-05-04
    revised: ""

  - purpose: canonical_json_encoding
    status: active
    api: "JSON.stringify() / JSON.parse_string() with pre-sort canonicalization: recursive key bytewise-ascending sort, NFC normalization, IEEE 754 finite float only, -0.0→0.0, explicit null, empty payload as {}"
    not: "store_var() / get_var() Variant blob; ResourceSaver / ResourceLoader for authority format; Dictionary dump without canonical sorting"
    adr: docs/architecture/adr-0003-save-system-snapshot-json.md
    reason: "Deterministic encoding required for checksum verification and cross-session integrity. Variant blobs have undefined ordering and platform-dependent encoding — GDD explicitly forbids. JSON is human-readable for debugging and has stable cross-version parsing."
    referenced_by:
      - docs/architecture/adr-0003-save-system-snapshot-json.md
    added: 2026-05-04
    revised: ""

  - purpose: save_storage_backend
    status: active
    api: "Godot FileAccess + user:// path (maps to IndexedDB on Web export); custom HTML shell + JavaScriptBridge for lifecycle events (visibilitychange, pagehide, pageshow)"
    not: "Pure IndexedDB via JavaScriptBridge for all storage (adds unnecessary cross-boundary complexity); Pure GDScript user:// without lifecycle JS bridge (lifecycle-blind — GDD forbids)"
    adr: docs/architecture/adr-0003-save-system-snapshot-json.md
    reason: "Godot 4.6 Web export maps user:// to IndexedDB, providing native FileAccess API. JS bridge is used only for lifecycle events that Godot engine cannot reliably capture (pagehide, visibilitychange). This avoids duplicating storage logic while ensuring Web lifecycle compliance."
    referenced_by:
      - docs/architecture/adr-0003-save-system-snapshot-json.md
    added: 2026-05-04
    revised: ""
  - purpose: abstract_interactable_pattern
    status: active
    api: "@abstract decorator (Godot 4.5+) on Interactable.handle_use() — all interactable objects extend Interactable base class with @export fields (interaction_id, anchor_radius, priority, interaction_type)"
    not: "Component pattern (InteractionComponent child node); String-based dispatch (interaction_type string matching to route to domain systems); Interface/duck-typing without @abstract enforcement"
    adr: docs/architecture/adr-0004-interaction-handler-abstract.md
    reason: "@abstract enforces handle_use() implementation at scene load time (not runtime); class_name provides IDE refactoring support and type-safe registration. Component pattern adds indirection without benefit; String-based dispatch loses type safety and creates God Object risk in InteractionRegistry."
    referenced_by:
      - docs/architecture/adr-0004-interaction-handler-abstract.md
    added: 2026-05-04
    revised: ""
  - purpose: dictionary_pool_storage
    status: active
    api: "Dictionary[StringName, Dictionary] for 6-pool resource storage — each pool: {stacks: Array[{resource_id: StringName, quantity: int}], capacity: Dictionary}"
    not: "Godot Resource typed pools (ResourceStack extends Resource — .tres serialization conflicts with Canonical JSON); typed class per pool (adds boilerplate without benefit beyond Dictionary key conventions)"
    adr: docs/architecture/adr-0005-resource-pool-system.md
    reason: "Dictionary maps directly to JSON.stringify() for ADR-0003 snapshot persistence without conversion layer. StringName keys provide O(1) comparison. 100+ stacks at ~100 bytes each is memory negligible."
    referenced_by:
      - docs/architecture/adr-0005-resource-pool-system.md
    added: 2026-05-04
    revised: ""

  - purpose: resource_result_enum
    status: active
    api: "ResourceResult enum (13 variants: SUCCESS + 12 ERR_* codes) — all resource operations return typed ResourceResult"
    not: "bool returns (lose failure reason); null returns (ambiguous — null could mean empty pool); exception-based error handling (GDScript exceptions are runtime-only, no compile-time exhaustiveness)"
    adr: docs/architecture/adr-0005-resource-pool-system.md
    reason: "Typed enum enables exhaustive match statements, precise UI error messages per failure mode (e.g., '物品栏已满' vs '堆叠已达上限'), and testability of each error path independently."
    referenced_by:
      - docs/architecture/adr-0005-resource-pool-system.md
    added: 2026-05-04
    revised: ""
  - purpose: web_export_config
    status: active
    api: "GDScript only (no C#) + single-threaded export + Compatibility renderer (WebGL 2) + user:// → IndexedDB. Custom HTML shell for lifecycle events."
    not: "C# scripts (cannot export to Web); GDExtension in Web export path; threaded export (requires COOP/COEP headers — unsupported by common static hosts); Vulkan/Forward+ renderer (not available on Web)"
    adr: docs/architecture/adr-0006-web-platform-constraints.md
    reason: "GDScript is the only language that can export to Web in Godot 4. Single-threaded export deploys to any static host without COOP/COEP requirements. Compatibility renderer maps to WebGL 2 — the only GPU API available in browser. user:// → IndexedDB is Godot 4.6 Web export default."
    referenced_by:
      - docs/architecture/adr-0006-web-platform-constraints.md
    added: 2026-05-04
    revised: ""

