# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: boot_signal_chain
    status: active
    pattern: signal
    producer: SessionShell
    consumers:
      - Registry
      - Persistence
      - Resources
      - Intel
      - Chart
      - InteractionRegistry
      - WorldRepair
      - AirshipHub
      - UIManager
      - FeedbackManager
    adr: docs/architecture/adr-0001-autoload-scene-boot-order.md
    signal_signature: "9-phase sequential: boot_requested → platform_ready → registry_ready → persistence_ready → core_data_ready → core_ready → foundation_ready → hub_ready → ui_ready → session_ready; plus boot_fatal(reason, diagnostics) and boot_recoverable(reason, user_message, retry_count)"
    referenced_by:
      - docs/architecture/adr-0001-autoload-scene-boot-order.md
      - docs/architecture/adr-0002-signal-communication-protocol.md
    added: 2026-05-04
    revised: ""

  - contract: scene_switch_protocol
    status: active
    pattern: direct_call
    producer: SessionShell
    consumers:
      - AirshipHub
      - ExplorationScene
      - Settlement
    adr: docs/architecture/adr-0001-autoload-scene-boot-order.md
    signal_signature: "Protocol: release_focus() → stop_tweens → cancel_awaits → disconnect_signals → remove_child → queue_free → instantiate → add_child → grab_focus()"
    referenced_by:
      - docs/architecture/adr-0001-autoload-scene-boot-order.md
    added: 2026-05-04
    revised: ""

  - contract: overlay_priority
    status: active
    pattern: direct_call
    producer: SessionShell
    consumers:
      - UIManager
    adr: docs/architecture/adr-0001-autoload-scene-boot-order.md
    signal_signature: "SessionShell overlays (FatalError, Pause, Loading) render above UIManager screen stack; when SessionShell overlay active, UIManager 4-layer input routing is suppressed"
    referenced_by:
      - docs/architecture/adr-0001-autoload-scene-boot-order.md
    added: 2026-05-04
    revised: ""

  - contract: signal_communication_protocol
    status: active
    pattern: signal
    producer: (all 9 Autoloads + 4 Scenes)
    consumers:
      - (all systems)
    adr: docs/architecture/adr-0002-signal-communication-protocol.md
    signal_signature: "34 cross-system signals cataloged. All follow {noun}_{verb_past} naming, typed params, fire-and-forget. Read queries use direct method calls; state changes use signals. Paired xxx_completed/xxx_failed for fallible operations."
    referenced_by:
      - docs/architecture/adr-0002-signal-communication-protocol.md
    added: 2026-05-04
    revised: ""

  - contract: signal_naming_convention
    status: active
    pattern: signal
    producer: (all systems)
    consumers:
      - (all systems)
    adr: docs/architecture/adr-0002-signal-communication-protocol.md
    signal_signature: "{noun}_{verb_past} — past tense for all cross-system signals (e.g., resource_deposited, route_committed). Matches Godot built-in style (pressed, timeout, finished)."
    referenced_by:
      - docs/architecture/adr-0002-signal-communication-protocol.md
    added: 2026-05-04
    revised: ""

  - contract: snapshot_package_contract
