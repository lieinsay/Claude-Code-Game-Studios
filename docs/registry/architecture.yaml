# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets: []

# Example:
#
# performance_budgets:
#   - target_fps: 60
#     total_frame_budget_ms: 16.6
#     platform: PC             # PC | Console | Mobile | All
#     adr: docs/architecture/adr-0000-performance-targets.md
#     added: 2026-03-26
#     revised: ""
#
#   - system: combat
#     status: active
#     budget_ms: 2.0
#     adr: docs/architecture/adr-0003-combat-system.md
#     notes: "Includes physics queries, hitbox evaluation, and damage calculation"
#     referenced_by:
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: scene_management
    status: active
    api: "SceneTree.root.add_child() / remove_child() / queue_free()"
    not: "change_scene_to_file() for Hub↔Exploration↔Settlement transitions"
    adr: docs/architecture/adr-0001-autoload-scene-boot-order.md
    reason: "add_child overlay preserves persistent layers (SessionShell, UIManager, AirshipHub) across scene transitions; change_scene_to_file replaces entire tree"
    referenced_by:
      - docs/architecture/adr-0001-autoload-scene-boot-order.md
    added: 2026-05-04
    revised: ""

  - purpose: boot_sequencing
    status: active
    api: "Godot signal chain (9-phase sequential signals from SessionShell)"
    not: "Autoload _ready() synchronous init; call_deferred() passive deferral"
    adr: docs/architecture/adr-0001-autoload-scene-boot-order.md
    reason: "Signal chain is explicit, traceable, and testable; _ready() synchronous init creates hidden ordering dependencies; call_deferred() offers no phase gating"
    referenced_by:
      - docs/architecture/adr-0001-autoload-scene-boot-order.md
    added: 2026-05-04
    revised: ""

  - purpose: scene_cleanup
    status: active
    api: "Node.queue_free()"
    not: "Node.free() (immediate, unsafe during signal emission); manual delete"
    adr: docs/architecture/adr-0001-autoload-scene-boot-order.md
    reason: "queue_free() is safe in Godot 4.6: signals auto-disconnect bidirectionally on free, Resources use ref-counting, no use-after-free when combined with signal payloads carrying only IDs (not object references)"
    referenced_by:
      - docs/architecture/adr-0001-autoload-scene-boot-order.md
    added: 2026-05-04
    revised: ""

  - purpose: signal_connect_syntax
    status: active
    api: "sender.signal_name.connect(receiver.method_name)"
    not: "sender.connect(\"signal_name\", callable) — string-based connect (deprecated since 4.0)"
    adr: docs/architecture/adr-0002-signal-communication-protocol.md
    reason: "Signal.connect() is type-safe — the signal_name is a compiled symbol, not a runtime string. IDE can find references, rename, and validate connection existence."
    referenced_by:
      - docs/architecture/adr-0002-signal-communication-protocol.md
    added: 2026-05-04
    revised: ""

  - purpose: signal_emit_sync
    status: active
    api: "signal.emit() — synchronous fire-and-forget in current frame"
    not: "signal.emit.call_deferred() — deferred emit breaks execution order"
    adr: docs/architecture/adr-0002-signal-communication-protocol.md
    reason: "Synchronous emit guarantees consumers execute in known order within the current frame. Essential for debugging signal chains and maintaining causal consistency."
    referenced_by:
      - docs/architecture/adr-0002-signal-communication-protocol.md
    added: 2026-05-04
    revised: ""

  - purpose: read_vs_signal_boundary
    status: active
    api: "Direct method call for read queries and action requests (returning Result); Signal for state-change notifications (fire-and-forget)"
    not: "Signal for read queries (would require return value — signals cannot return); Direct method call for fan-out notifications (tight coupling)"
    adr: docs/architecture/adr-0002-signal-communication-protocol.md
    reason: "Read queries need return values → direct call. State-change notifications need fan-out to unknown consumers → signal. This distinction prevents both return-value-via-signal hacks and tight-coupling-via-direct-call fanout."
    referenced_by:
      - docs/architecture/adr-0002-signal-communication-protocol.md
    added: 2026-05-04
    revised: ""

  - purpose: canonical_json_encoding
    status: active
    api: "JSON.stringify() / JSON.parse_string() with pre-sort canonicalization: recursive key bytewise-ascending sort, NFC normalization, IEEE 754 finite float only, -0.0→0.0, explicit null, empty payload as {}"
    not: "store_var() / get_var() Variant blob; ResourceSaver / ResourceLoader for authority format; Dictionary dump without canonical sorting"
    adr: docs/architecture/adr-0003-save-system-snapshot-json.md
    reason: "Deterministic encoding required for checksum verification and cross-session integrity. Variant blobs have undefined ordering and platform-dependent encoding — GDD explicitly forbids. JSON is human-readable for debugging and has stable cross-version parsing."
    referenced_by:
      - docs/architecture/adr-0003-save-system-snapshot-json.md
    added: 2026-05-04
    revised: ""

  - purpose: save_storage_backend
    status: active
    api: "Godot FileAccess + user:// path (maps to IndexedDB on Web export); custom HTML shell + JavaScriptBridge for lifecycle events (visibilitychange, pagehide, pageshow)"
    not: "Pure IndexedDB via JavaScriptBridge for all storage (adds unnecessary cross-boundary complexity); Pure GDScript user:// without lifecycle JS bridge (lifecycle-blind — GDD forbids)"
    adr: docs/architecture/adr-0003-save-system-snapshot-json.md
    reason: "Godot 4.6 Web export maps user:// to IndexedDB, providing native FileAccess API. JS bridge is used only for lifecycle events that Godot engine cannot reliably capture (pagehide, visibilitychange). This avoids duplicating storage logic while ensuring Web lifecycle compliance."
    referenced_by:
      - docs/architecture/adr-0003-save-system-snapshot-json.md
    added: 2026-05-04
    revised: ""
  - purpose: abstract_interactable_pattern
    status: active
    api: "@abstract decorator (Godot 4.5+) on Interactable.handle_use() — all interactable objects extend Interactable base class with @export fields (interaction_id, anchor_radius, priority, interaction_type)"
    not: "Component pattern (InteractionComponent child node); String-based dispatch (interaction_type string matching to route to domain systems); Interface/duck-typing without @abstract enforcement"
    adr: docs/architecture/adr-0004-interaction-handler-abstract.md
    reason: "@abstract enforces handle_use() implementation at scene load time (not runtime); class_name provides IDE refactoring support and type-safe registration. Component pattern adds indirection without benefit; String-based dispatch loses type safety and creates God Object risk in InteractionRegistry."
    referenced_by:
      - docs/architecture/adr-0004-interaction-handler-abstract.md
    added: 2026-05-04
    revised: ""
  - purpose: dictionary_pool_storage
    status: active
    api: "Dictionary[StringName, Dictionary] for 6-pool resource storage — each pool: {stacks: Array[{resource_id: StringName, quantity: int}], capacity: Dictionary}"
    not: "Godot Resource typed pools (ResourceStack extends Resource — .tres serialization conflicts with Canonical JSON); typed class per pool (adds boilerplate without benefit beyond Dictionary key conventions)"
    adr: docs/architecture/adr-0005-resource-pool-system.md
    reason: "Dictionary maps directly to JSON.stringify() for ADR-0003 snapshot persistence without conversion layer. StringName keys provide O(1) comparison. 100+ stacks at ~100 bytes each is memory negligible."
    referenced_by:
      - docs/architecture/adr-0005-resource-pool-system.md
    added: 2026-05-04
    revised: ""

  - purpose: resource_result_enum
    status: active
    api: "ResourceResult enum (13 variants: SUCCESS + 12 ERR_* codes) — all resource operations return typed ResourceResult"
    not: "bool returns (lose failure reason); null returns (ambiguous — null could mean empty pool); exception-based error handling (GDScript exceptions are runtime-only, no compile-time exhaustiveness)"
    adr: docs/architecture/adr-0005-resource-pool-system.md
    reason: "Typed enum enables exhaustive match statements, precise UI error messages per failure mode (e.g., '物品栏已满' vs '堆叠已达上限'), and testability of each error path independently."
    referenced_by:
      - docs/architecture/adr-0005-resource-pool-system.md
    added: 2026-05-04
    revised: ""
  - purpose: web_export_config
    status: active
    api: "GDScript only (no C#) + single-threaded export + Compatibility renderer (WebGL 2) + user:// → IndexedDB. Custom HTML shell for lifecycle events."
    not: "C# scripts (cannot export to Web); GDExtension in Web export path; threaded export (requires COOP/COEP headers — unsupported by common static hosts); Vulkan/Forward+ renderer (not available on Web)"
    adr: docs/architecture/adr-0006-web-platform-constraints.md
    reason: "GDScript is the only language that can export to Web in Godot 4. Single-threaded export deploys to any static host without COOP/COEP requirements. Compatibility renderer maps to WebGL 2 — the only GPU API available in browser. user:// → IndexedDB is Godot 4.6 Web export default."
    referenced_by:
      - docs/architecture/adr-0006-web-platform-constraints.md
    added: 2026-05-04
    revised: ""
  - purpose: dictionary_knowledge_storage
    status: active
    api: "Dictionary[StringName, int/Dictionary/Array] for all knowledge/pattern/ability runtime state — knowledge_state, pattern_state, ability_state, consumed_intel_ids, rumor_sources"
    not: "Godot Resource typed entries (conflicts with ADR-0003 Canonical JSON serialization); SQLite/local database (over-engineered for < 50KB state); typed class per knowledge entry (adds boilerplate without benefit)"
    adr: docs/architecture/adr-0007-intel-knowledge-ability-system.md
    reason: "Dictionary maps directly to JSON.stringify() for ADR-0003 snapshot persistence without conversion layer. Consistent with ADR-0005 resource pool Dictionary storage. StringName keys provide O(1) comparison. Total state < 50KB — memory negligible."
    referenced_by:
      - docs/architecture/adr-0007-intel-knowledge-ability-system.md
    added: 2026-05-05
    revised: ""

  - purpose: ability_unlock_data_driven
    status: active
    api: "Data-driven ability unlock path definitions (Dictionary of condition types: pattern_state, intel_consumed, observation_event_count, observation_event_type_count, partner_in_crew, repair_completed, location_visit_count, fog_traversal_count). Each ability has 2-4 paths; OR across paths, AND within path."
    not: "Hardcoded if-else chains per ability (adding a new path requires code change); ScriptableObject/Resource-based unlock graphs (conflicts with ADR-0003 Canonical JSON); Event-driven unlock without centralized condition check (race conditions)"
    adr: docs/architecture/adr-0007-intel-knowledge-ability-system.md
    reason: "Data-driven definitions allow adding new abilities and paths by updating configuration data only — no algorithm code changes. Condition evaluators are reusable across abilities. Centralized check_unlock_conditions() ensures atomic evaluation within a single frame."
    referenced_by:
      - docs/architecture/adr-0007-intel-knowledge-ability-system.md
    added: 2026-05-05
    revised: ""

  - purpose: swap_module_atomicity
    status: active
    api: "Two-phase atomic swap_module: Phase 1 validates all preconditions (slot non-empty, not same type, cargo_bay empty if cargo→non-cargo, net cost affordable) → any failure returns error with zero state change. Phase 2 executes in fixed order (uninstall old → refund → install new → charge net cost)."
    not: "Optimistic install-then-rollback (creates visible intermediate states); Separate uninstall+install exposed as two user actions (adds unnecessary intermediate empty state and doubles material UI confirmations)"
    adr: docs/architecture/adr-0009-airship-module-hull-system.md
    reason: "Two-phase atomicity guarantees no 'uninstalled but can't install' state. Single-threaded execution (ADR-0006) guarantees Phase 1→2 without external interference. Net cost per resource type prevents cross-type refund abuse."
    referenced_by:
      - docs/architecture/adr-0009-airship-module-hull-system.md
    added: 2026-05-05
    revised: ""

  - purpose: dual_field_module_efficiency
    status: active
    api: "Dual-field actual_state / visible_state per module slot. Efficiency chain: η_visible = EFFICIENCY_TABLE[module_type][visible_state]; η_final = η_visible × HULL_EFFICIENCY_BAND[hull_band]. visible_state drives UI display and player decision-making; actual_state is the ground truth written by Combat/Navigation."
    not: "Single state field per slot (cannot represent 'unchecked' uncertainty); efficiency computed from actual_state alone (players cannot see actual damage — breaks the inspection gameplay loop)"
    adr: docs/architecture/adr-0009-airship-module-hull-system.md
    reason: "Dual-field enables the 'return to port → uncertain module state → inspect or blind-repair' gameplay loop. visible_state-based efficiency means players make decisions with imperfect information. actual_state is the authoritative source for damage but is hidden from players until inspection."
    referenced_by:
      - docs/architecture/adr-0009-airship-module-hull-system.md
    added: 2026-05-05
    revised: ""

  - purpose: encounter_context_dictionary_transfer
    status: active
    api: "Dictionary[StringName, Variant] for cross-system EncounterContext transfer — Navigation (#10) builds Dictionary, emits via voyage_completed signal, Exploration (#11) validates and consumes. Full EncounterContext included in progress.voyage snapshot for ADR-0003 persistence."
    not: "Godot Resource subclass (class_name EncounterContext extends Resource — .tres serialization conflicts with ADR-0003 Canonical JSON); Multiple fine-grained signals per encounter (adds aggregation complexity in Exploration, violates ADR-0002 max cascade depth); Exploration pulling from Navigation (introduces lifecycle coupling — Navigation must remain active after voyage end)"
    adr: docs/architecture/adr-0010-encounter-context-type.md
    reason: "Dictionary maps directly to JSON.stringify() for ADR-0003 snapshot persistence without conversion layer. Consistent with ADR-0005/0007/0009 Dictionary storage pattern. Signal push model allows Navigation to fully close after voyage_completed emission — no lifecycle coupling."
    referenced_by:
      - docs/architecture/adr-0010-encounter-context-type.md
    added: 2026-05-05
    revised: ""

  - purpose: batch_deposit_atomicity
    status: active
    api: "Two-phase submit_deposit: Phase 1 validates (validate_deposit checks 5 violation types) → Phase 2 executes (ResourcesManager.commit_deposit → deposited counter update → repair_progress recalculation → repair_completion check → signal fan-out). All-or-nothing: validation failure returns violations without state change."
    not: "Direct pool writes bypassing commit_deposit (breaks Pool 6 audit trail); optimistic deposit-then-validate (creates visible deposit-then-reversal confusing to player); single-phase deposit without validation separation (mixes validation errors with commit failures)"
    adr: docs/architecture/adr-0011-world-repair-state-machine.md
    reason: "Two-phase atomicity guarantees no 'materials consumed but repair not counted' state. Single-threaded execution (ADR-0006) guarantees Phase 1→2 without external interference. Consistent with ADR-0009 swap_module two-phase atomic pattern."
    referenced_by:
      - docs/architecture/adr-0011-world-repair-state-machine.md
    added: 2026-05-05
    revised: ""

  - purpose: irreversible_repair_state_machine
    status: active
    api: "3-state irreversible state machine: UNREVEALED(0) → KNOWN(1) → REPAIRED(2). known→repaired is one-way (irreversible). All reverse transitions rejected by state machine. REPAIRED state returns ERR_ALREADY_REPAIRED on submit_deposit."
    not: "Reversible repair (undo/refund — violates Pool 6 finality and Pillar 2 'world remembers care'); 2-state skip-known model (loses 'discovery' moment and gradual progress feedback); multi-branch repair tree per node (adds complexity without MVP benefit)"
    adr: docs/architecture/adr-0011-world-repair-state-machine.md
    reason: "Irreversible known→repaired transition supports Pillar 2 (世界会回应照料 — player care leaves permanent trace). Physical arrival always advances unrevealed→known — knowledge gating only affects UI hint precision, never blocks interaction."
    referenced_by:
      - docs/architecture/adr-0011-world-repair-state-machine.md
    added: 2026-05-05
    revised: ""

  - purpose: godot4_6_dual_focus_sync
    status: active
    api: "Explicit mouse-click → grab_focus() synchronization for all interactable Controls. Separate Theme StyleBoxes: focus (keyboard) = #4FB7B2 1.5px solid border; hover (mouse) = bg +10% brightness, no border. Readonly elements: focus_mode = Control.FOCUS_NONE."
    not: "Relying on Godot default dual-focus behavior without explicit sync (causes 'two focus indicators visible simultaneously'); using grab_focus() alone without mouse press sync (mouse click leaves keyboard focus on previous control); single style for both focus and hover (visually confusing in 4.6 dual-focus system)"
    adr: docs/architecture/adr-0012-ui-input-routing-dual-focus.md
    reason: "Godot 4.6 dual-focus separates mouse/touch focus from keyboard/gamepad focus. Without explicit sync, clicking a button with mouse then pressing Tab navigates from the old keyboard focus position — not the clicked position. FocusSync base classes encapsulate this per ADR-0012 Risk mitigation."
    referenced_by:
      - docs/architecture/adr-0012-ui-input-routing-dual-focus.md
    added: 2026-05-05
    revised: ""

  - purpose: create_tween_animation_policy
    status: active
    api: "All UI animation via create_tween() (SceneTreeTween) — 0.15s–3.0s with Tween.EASE_OUT/EASE_IN presets. Ink spread animation via ShaderMaterial + uniform progress (GPU-side). Fullscreen parchment via NinePatchRect 9-slice. No manual _process() interpolation."
    not: "Canvas draw_*() for ink spread (CPU-bound per-frame redraw — prohibited for WebGL 2 Compatibility renderer); manual _process() delta interpolation (brittle under Web tab freeze — delta spikes cause animation jumps); full 2048x2048 textures for parchment backgrounds (memory waste — use NinePatchRect 9-slice)"
    adr: docs/architecture/adr-0012-ui-input-routing-dual-focus.md
    reason: "create_tween() is the Godot 4.6 idiomatic animation API — it handles frame delta, pause, and Web tab freeze recovery correctly. GPU ShaderMaterial ink spread avoids CPU-side Canvas draw calls. NinePatchRect reduces parchment texture memory from ~16MB (2048² RGBA8) to ~256KB (256² source)."
    referenced_by:
      - docs/architecture/adr-0012-ui-input-routing-dual-focus.md
    added: 2026-05-05
    revised: ""

  - purpose: chart_terminal_state_guard
    status: active
    api: "DEPARTURE_CONFIRMED 终端状态守卫 — chart_state_transition() 在任何 trigger 下对 DEPARTURE_CONFIRMED 状态返回 {allowed: false}。route_committed 单次发射保证由状态机本身提供，不依赖外部去重逻辑。"
    not: "外部去重逻辑 (boolean flag / debounce timer) — 与状态机分离的去重可能不同步；可逆出航确认 (允许 DEPARTURE_CONFIRMED → BROWSING) — 违反 GDD #9 不可逆约束和 Pillar 1 规划重量"
    adr: docs/architecture/adr-0008-chart-route-state-machine.md
    reason: "状态机层面的终端守卫是单次发射保证的最可靠实现——在状态的唯一入口处拦截，而非在信号发射处事后去重。同一帧内两次 CONFIRM 触发：第一个成功转换 → DEPARTURE_CONFIRMED，第二个命中终端守卫 → allowed: false。"
    referenced_by:
      - docs/architecture/adr-0008-chart-route-state-machine.md
    added: 2026-05-05
    revised: ""

  - purpose: route_selectability_short_circuit
    status: active
    api: "短路求值顺序: hidden → locked → unavailable (traversable) → unavailable (origin) → selected → browsable。hidden 在第一分支返回，避免对不可见航线进行跨系统查询（IntelManager.query_route_accessibility, Registry.get_route_origin, AirshipHub.get_current_docked_location）。"
    not: "全量查询模式 (对每条航线执行所有 6 层判断) — 浪费跨系统查询；并行查询所有航线的 traversable 状态 — 无实际收益（MVP 仅 2 条航线）且破坏短路逻辑"
    adr: docs/architecture/adr-0008-chart-route-state-machine.md
    reason: "短路求值在 hidden 分支即返回，节省对不可见航线的 3 次跨系统查询。遵循 ADR-0007 的 '下游不得缓存查询结果' 规则——短路不是缓存，是条件判断排序优化。"
    referenced_by:
      - docs/architecture/adr-0008-chart-route-state-machine.md
    added: 2026-05-05
    revised: ""

