name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run C# Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build CloudWeaverVoyage.sln

      - name: Run all C# test runners
        shell: bash
        run: |
          for project in $(find tests -name '*.csproj' | sort); do
            echo "Running $project"
            dotnet run --project "$project"
          done
