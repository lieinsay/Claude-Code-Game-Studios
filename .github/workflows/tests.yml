name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run C# Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build CloudWeaverVoyage.sln

      - name: Run foundation parity
        run: dotnet run --project tests/csharp/FoundationParity/FoundationParity.csproj

      - name: Run resources stack merge unit tests
        run: dotnet run --project tests/unit/resources/StackMergeTest.csproj

      - name: Run resources capacity unit tests
        run: dotnet run --project tests/unit/resources/CapacitySystemTest.csproj

      - name: Run resources cargo unpack unit tests
        run: dotnet run --project tests/unit/resources/CargoUnpackTest.csproj

      - name: Run resources weight mass unit tests
        run: dotnet run --project tests/unit/resources/WeightMassTest.csproj

      - name: Run resources core operations unit tests
        run: dotnet run --project tests/unit/resources/CoreOperationsTest.csproj

      - name: Run resources state machine unit tests
        run: dotnet run --project tests/unit/resources/ResourcesStateMachineTest.csproj

      - name: Run resources specialized operations integration tests
        run: dotnet run --project tests/integration/resources/SpecializedOpsTest.csproj

      - name: Run resources signal contract integration tests
        run: dotnet run --project tests/integration/resources/ResourcesSignalContractTest.csproj

      - name: Run resources persistence integration tests
        run: dotnet run --project tests/integration/resources/ResourcesPersistenceIntegrationTest.csproj

      - name: Run registry unit tests
        run: dotnet run --project tests/unit/registry/IdRegistryCoreTest.csproj

      - name: Run registry diagnostic unit tests
        run: dotnet run --project tests/unit/registry/DiagnosticSystemTest.csproj

      - name: Run session state machine unit tests
        run: dotnet run --project tests/unit/session/SessionStateMachineTest.csproj

      - name: Run session entry/audio integration tests
        run: dotnet run --project tests/integration/session/EntryAudioTest.csproj

      - name: Run session suspend/resume integration tests
        run: dotnet run --project tests/integration/session/SuspendResumeTest.csproj

      - name: Run session failure severity unit tests
        run: dotnet run --project tests/unit/session/FailureSeverityTest.csproj

      - name: Run session storage capability integration tests
        run: dotnet run --project tests/integration/session/SessionStorageCapabilityTest.csproj

      - name: Run session input gate integration tests
        run: dotnet run --project tests/integration/session/InputGateTest.csproj

      - name: Run movement system unit tests
        run: dotnet run --project tests/unit/movement/MovementSystemTest.csproj

      - name: Run movement focus selection unit tests
        run: dotnet run --project tests/unit/movement/FocusSelectionTest.csproj

      - name: Run movement use gate unit tests
        run: dotnet run --project tests/unit/movement/UseGateTest.csproj

      - name: Run movement input gate integration tests
        run: dotnet run --project tests/integration/movement/MovementInputGateTest.csproj

      - name: Run movement interactable registry integration tests
        run: dotnet run --project tests/integration/movement/MovementInteractableRegistryTest.csproj

      - name: Run movement semantic events integration tests
        run: dotnet run --project tests/integration/movement/MovementSemanticEventsTest.csproj

      - name: Run movement boundary integration tests
        run: dotnet run --project tests/integration/movement/MovementCrossSystemBoundariesTest.csproj

      - name: Run hub docking state machine integration tests
        run: dotnet run --project tests/integration/hub/DockingStateMachineTest.csproj

      - name: Run hub station registry integration tests
        run: dotnet run --project tests/integration/hub/StationRegistryTest.csproj

      - name: Run hub room gating integration tests
        run: dotnet run --project tests/integration/hub/RoomGatingTest.csproj

      - name: Run hub departure modes integration tests
        run: dotnet run --project tests/integration/hub/DepartureModesTest.csproj

      - name: Run hub arrival flow integration tests
        run: dotnet run --project tests/integration/hub/ArrivalFlowTest.csproj

      - name: Run hub life trace anchor integration tests
        run: dotnet run --project tests/integration/hub/LifeTraceAnchorsTest.csproj

      - name: Run hub signal contract integration tests
        run: dotnet run --project tests/integration/hub/HubSignalContractTest.csproj

      - name: Run hub persistence transition integration tests
        run: dotnet run --project tests/integration/hub/PersistenceTransitionTest.csproj

      - name: Run shell UI model tests
        run: dotnet run --project tests/integration/session/ShellUiTest.csproj

      - name: Run presentation diagnostic UI tests
        run: dotnet run --project tests/unit/presentation/DiagnosticUITest.csproj

      - name: Run feedback router core unit tests
        run: dotnet run --project tests/unit/feedback-fx-audio/FeedbackRouterCoreTest.csproj

      - name: Run feedback semantic event wiring integration tests
        run: dotnet run --project tests/integration/feedback-fx-audio/SemanticEventWiringTest.csproj

      - name: Run UI HUD screen state machine unit tests
        run: dotnet run --project tests/unit/ui-hud-interface/ScreenStateMachineTest.csproj

      - name: Run UI HUD modal stack input routing unit tests
        run: dotnet run --project tests/unit/ui-hud-interface/ModalStackInputRoutingTest.csproj

      - name: Run UI HUD update panel lifecycle unit tests
        run: dotnet run --project tests/unit/ui-hud-interface/HudUpdatePanelLifecycleTest.csproj

      - name: Run registry domain loading integration tests
        run: dotnet run --project tests/integration/registry/DomainLoadingTest.csproj

      - name: Run persistence save pipeline unit tests
        run: dotnet run --project tests/unit/persistence/SavePipelineTest.csproj

      - name: Run persistence snapshot package unit tests
        run: dotnet run --project tests/unit/persistence/SnapshotPackageTest.csproj

      - name: Run persistence storage capability unit tests
        run: dotnet run --project tests/unit/persistence/PersistenceStorageCapabilityTest.csproj

      - name: Run persistence migration unit tests
        run: dotnet run --project tests/unit/persistence/MigrationTest.csproj

      - name: Run persistence backup failover unit tests
        run: dotnet run --project tests/unit/persistence/BackupFailoverTest.csproj

      - name: Run partner cat state machine unit tests
        run: dotnet run --project tests/unit/partner-relationships/CatStateMachineTest.csproj

      - name: Run partner scout sniff unit tests
        run: dotnet run --project tests/unit/partner-relationships/ScoutSniffTest.csproj

      - name: Run partner naming and nest unit tests
        run: dotnet run --project tests/unit/partner-relationships/NamingNestTest.csproj

      - name: Run partner hub intel integration tests
        run: dotnet run --project tests/integration/partner-relationships/HubIntelIntegrationTest.csproj

      - name: Run partner persistence integration tests
        run: dotnet run --project tests/integration/partner-relationships/PartnerPersistenceTest.csproj

      - name: Run partner edge cases integration tests
        run: dotnet run --project tests/integration/partner-relationships/PartnerEdgeCasesTest.csproj

      - name: Run persistence artifact isolation integration tests
        run: dotnet run --project tests/integration/persistence/ArtifactIsolationTest.csproj

      - name: Run persistence continue availability integration tests
        run: dotnet run --project tests/integration/persistence/ContinueAvailabilityTest.csproj

      - name: Run persistence desktop lifecycle integration tests
        run: dotnet run --project tests/integration/persistence/DesktopLifecycleTest.csproj

      - name: Run persistence backup failover unit tests
        run: dotnet run --project tests/unit/persistence/BackupFailoverTest.csproj
