name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run C# Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build CloudWeaverVoyage.sln

      - name: Run foundation parity
        run: dotnet run --project tests/csharp/FoundationParity/FoundationParity.csproj

      - name: Run registry unit tests
        run: dotnet run --project tests/unit/registry/IdRegistryCoreTest.csproj

      - name: Run registry diagnostic unit tests
        run: dotnet run --project tests/unit/registry/DiagnosticSystemTest.csproj

      - name: Run session state machine unit tests
        run: dotnet run --project tests/unit/session/StateMachineTest.csproj

      - name: Run session entry/audio integration tests
        run: dotnet run --project tests/integration/session/EntryAudioTest.csproj

      - name: Run session suspend/resume integration tests
        run: dotnet run --project tests/integration/session/SuspendResumeTest.csproj

      - name: Run session failure severity unit tests
        run: dotnet run --project tests/unit/session/FailureSeverityTest.csproj

      - name: Run session storage capability integration tests
        run: dotnet run --project tests/integration/session/StorageCapabilityTest.csproj

      - name: Run session input gate integration tests
        run: dotnet run --project tests/integration/session/InputGateTest.csproj

      - name: Run movement system unit tests
        run: dotnet run --project tests/unit/movement/MovementSystemTest.csproj

      - name: Run movement focus selection unit tests
        run: dotnet run --project tests/unit/movement/FocusSelectionTest.csproj

      - name: Run movement use gate unit tests
        run: dotnet run --project tests/unit/movement/UseGateTest.csproj

      - name: Run movement input gate integration tests
        run: dotnet run --project tests/integration/movement/MovementInputGateTest.csproj

      - name: Run movement interactable registry integration tests
        run: dotnet run --project tests/integration/movement/MovementInteractableRegistryTest.csproj

      - name: Run movement semantic events integration tests
        run: dotnet run --project tests/integration/movement/MovementSemanticEventsTest.csproj

      - name: Run movement boundary integration tests
        run: dotnet run --project tests/integration/movement/MovementCrossSystemBoundariesTest.csproj

      - name: Run shell UI model tests
        run: dotnet run --project tests/integration/session/ShellUiTest.csproj

      - name: Run presentation diagnostic UI tests
        run: dotnet run --project tests/unit/presentation/DiagnosticUITest.csproj

      - name: Run registry domain loading integration tests
        run: dotnet run --project tests/integration/registry/DomainLoadingTest.csproj

      - name: Run persistence save pipeline unit tests
        run: dotnet run --project tests/unit/persistence/SavePipelineTest.csproj

      - name: Run persistence snapshot package unit tests
        run: dotnet run --project tests/unit/persistence/SnapshotPackageTest.csproj

      - name: Run persistence storage capability unit tests
        run: dotnet run --project tests/unit/persistence/StorageCapabilityTest.csproj

      - name: Run persistence migration unit tests
        run: dotnet run --project tests/unit/persistence/MigrationTest.csproj

      - name: Run persistence backup failover unit tests
        run: dotnet run --project tests/unit/persistence/BackupFailoverTest.csproj

      - name: Run persistence artifact isolation integration tests
        run: dotnet run --project tests/integration/persistence/ArtifactIsolationTest.csproj

      - name: Run persistence continue availability integration tests
        run: dotnet run --project tests/integration/persistence/ContinueAvailabilityTest.csproj

      - name: Run persistence desktop lifecycle integration tests
        run: dotnet run --project tests/integration/persistence/DesktopLifecycleTest.csproj

      - name: Run persistence backup failover unit tests
        run: dotnet run --project tests/unit/persistence/BackupFailoverTest.csproj
