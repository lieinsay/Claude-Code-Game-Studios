name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run C# Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build CloudWeaverVoyage.sln

      - name: Run foundation parity
        run: dotnet run --project tests/csharp/FoundationParity/FoundationParity.csproj

      - name: Run registry unit tests
        run: dotnet run --project tests/unit/registry/IdRegistryCoreTest.csproj
